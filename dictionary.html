<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dictionary">
<meta name="mobile-web-app-capable" content="yes">
<style>html{touch-action:manipulation;}</style>
<title>Dictionary</title>
<style>
:root {
  --bg:#0e0e0f;--bg2:#181819;--bg3:#222224;--border:#2e2e31;
  --text:#f0ede8;--text2:#888884;--text3:#555552;
  --blue:#5db8ff;--green:#5dff8a;
  --radius:14px;--safe-bottom:env(safe-area-inset-bottom,16px);
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --font-mono:"SF Mono","Menlo","Monaco",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:15px;min-height:100vh;max-width:480px;margin:0 auto;}
.scroll-area{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:100vh;padding-bottom:calc(24px + var(--safe-bottom));}

/* ── topbar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);}
.topbar-title{font-size:19px;font-weight:700;letter-spacing:-0.3px;}
.topbar-sub{font-size:12px;color:var(--text2);font-family:var(--font-mono);}

/* ── dictionary ── */
.dict-wrap{padding:16px;}
.dict-search-row{display:flex;gap:8px;margin-bottom:20px;}
.dict-input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:13px 15px;color:var(--text);font-size:16px;font-family:var(--font-sans);outline:none;transition:border-color 0.15s;-webkit-appearance:none;}
.dict-input:focus{border-color:var(--blue);}
.dict-input::placeholder{color:var(--text3);}
.dict-search-btn{background:var(--blue);color:#0e0e0f;border:none;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;font-family:var(--font-sans);cursor:pointer;flex-shrink:0;transition:opacity 0.1s;}
.dict-search-btn:active{opacity:0.8;}
.dict-header-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;}
.dict-word{font-size:30px;font-weight:700;letter-spacing:-0.5px;margin-bottom:6px;}
.dict-phonetic{font-size:15px;color:var(--blue);font-family:var(--font-mono);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.dict-audio-btn{background:none;border:1px solid rgba(93,184,255,0.4);border-radius:20px;padding:5px 12px;color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-sans);transition:background 0.1s;}
.dict-audio-btn:active{background:rgba(93,184,255,0.12);}
.dict-pos-badge{display:inline-block;background:rgba(93,184,255,0.1);color:var(--blue);border:1px solid rgba(93,184,255,0.25);border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;margin:14px 0 10px;}
.dict-def-card{padding:12px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
.dict-def-num{font-size:10px;color:var(--text3);margin-bottom:5px;font-family:var(--font-mono);font-weight:700;}
.dict-def-text{font-size:14px;line-height:1.7;color:var(--text);}
.dict-def-ex{font-size:13px;color:var(--text2);margin-top:7px;line-height:1.55;font-style:italic;border-left:2px solid var(--border);padding-left:9px;}
.dict-loading{text-align:center;padding:48px 20px;color:var(--text3);font-size:14px;}
.dict-error{text-align:center;padding:36px 20px;color:var(--text3);font-size:14px;line-height:1.8;}
.dict-error b{color:var(--text2);}
.dict-synonyms{margin-top:8px;font-size:12px;color:var(--text2);}
.dict-synonyms span{color:var(--text3);}
</style>
</head>
<body>

<div class="scroll-area">
  <div class="topbar">
    <div class="topbar-title">Dictionary</div>
    <div class="topbar-sub">English – English</div>
  </div>
  <div class="dict-wrap">
    <div class="dict-search-row">
      <input class="dict-input" id="dict-input" placeholder="Enter a word…"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        onkeydown="if(event.key==='Enter')lookupWord()">
      <button class="dict-search-btn" onclick="lookupWord()">Search</button>
    </div>
    <div id="dict-result"><div class="dict-loading" style="padding-top:60px;">
      <div style="font-size:28px;margin-bottom:12px;">📖</div>
      Type a word above and press Search
    </div></div>
  </div>
</div>

<script>
// ─── DICTIONARY ─────────────────────────────────────────
let dictAudio = null;

async function lookupWord() {
  const word = document.getElementById('dict-input').value.trim();
  if (!word) return;
  const resultEl = document.getElementById('dict-result');
  resultEl.innerHTML = '<div class="dict-loading">Looking up <b style="color:var(--text);">' + word + '</b>…</div>';

  try {
    const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word));
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    renderDictResult(data[0]);
  } catch (e) {
    resultEl.innerHTML = '<div class="dict-error"><div style="font-size:24px;margin-bottom:10px;">🔍</div><b>"' + word + '"</b> was not found.<br><span style="font-size:12px;">Check the spelling or try another word.</span></div>';
  }
}

function renderDictResult(entry) {
  // Prefer US pronunciation; fall back to any phonetic with text
  const usPhonetic = (entry.phonetics || []).find(p => p.audio && p.audio.includes('-us'));
  const anyAudio   = (entry.phonetics || []).find(p => p.audio);
  const anyText    = (entry.phonetics || []).find(p => p.text);
  const phoneticText = entry.phonetic || (usPhonetic && usPhonetic.text) || (anyText && anyText.text) || '';
  const audioUrl     = (usPhonetic && usPhonetic.audio) || (anyAudio && anyAudio.audio) || '';

  let html = '<div class="dict-header-card">';
  html += '<div class="dict-word">' + entry.word + '</div>';
  html += '<div class="dict-phonetic">';
  if (phoneticText) html += '<span>' + phoneticText + '</span>';
  if (audioUrl) html += '<button class="dict-audio-btn" onclick="playDictAudio(\'' + audioUrl.replace(/'/g, "\\'") + '\')">▶ Listen</button>';
  html += '</div>';
  html += '</div>';

  (entry.meanings || []).forEach(function(m) {
    html += '<div class="dict-pos-badge">' + m.partOfSpeech + '</div>';
    var defs = (m.definitions || []).slice(0, 4);
    defs.forEach(function(d, i) {
      html += '<div class="dict-def-card">';
      html += '<div class="dict-def-num">DEF ' + (i + 1) + '</div>';
      html += '<div class="dict-def-text">' + d.definition + '</div>';
      if (d.example) html += '<div class="dict-def-ex">' + d.example + '</div>';
      html += '</div>';
    });
    if (m.synonyms && m.synonyms.length > 0) {
      html += '<div class="dict-synonyms"><span>Synonyms: </span>' + m.synonyms.slice(0, 6).join(', ') + '</div>';
    }
  });

  document.getElementById('dict-result').innerHTML = html;
}

function playDictAudio(url) {
  if (dictAudio) { dictAudio.pause(); }
  dictAudio = new Audio(url);
  dictAudio.play().catch(function() {});
}
</script>
</body>
</html>
